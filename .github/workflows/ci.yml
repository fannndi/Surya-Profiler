name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt · clippy · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Architecture guardrails
        working-directory: ${{ github.workspace }}
        run: ./scripts/arch-check.sh

  android:
    name: Android (unit tests · assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Cross-build ARM64
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          cargo ndk -t arm64-v8a build --release
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + APK (syncCore uses the fresh ARM64 build)
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Asset lockstep after sync
        run: ./scripts/check-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
